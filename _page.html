<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.6; color: #2b3433;
            background: linear-gradient(180deg, #11807d 0%, #0a5b5d 100%);
            min-height: 100vh;
        }
        .hero { text-align: center; padding: 60px 20px 40px; color: #ffffff; }
        .hero.small { padding: 40px 20px 24px; }
        .app-icon { width: 120px; height: 120px; border-radius: 27px; margin: 0 auto 30px; display: block;
            box-shadow: 0 10px 40px rgba(0,0,0,0.35); }
        .hero.small .app-icon { width: 72px; height: 72px; border-radius: 16px; margin-bottom: 16px; }
        h1 { font-size: 2.5em; margin-bottom: 15px; font-weight: 700; }
        .tagline { font-size: 1.2em; opacity: 0.9; margin-bottom: 10px; }
        .container { max-width: 900px; margin: 0 auto; padding: 0 20px 60px; }
        .shots { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; padding: 10px 0 30px; }
        .shots img { width: 100%; height: auto; border-radius: 18px; display: block; box-shadow: 0 8px 30px rgba(0,0,0,0.35); }
        .card { background: white; border-radius: 16px; padding: 40px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
        .card h2 { text-align: center; margin-bottom: 24px; color: #12201f; }
        .card h3 { color: #12201f; margin: 28px 0 10px; font-size: 1.1em; }
        .card p { margin-bottom: 14px; }
        .card ul { margin: 0 0 14px 22px; }
        .card li { margin-bottom: 8px; }
        .card code { background: #eef4f3; padding: 1px 5px; border-radius: 4px; font-size: 0.92em; }
        .features { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 30px; }
        .feature { text-align: center; }
        .feature-icon { font-size: 40px; margin-bottom: 15px; }
        .feature h3 { font-size: 1.1em; margin: 0 0 8px; }
        .feature p { font-size: 0.95em; color: #5c6b6a; }
        .privacy-note { text-align: center; color: #12201f; background: #ffd9cc; border-radius: 12px; padding: 18px 24px; font-weight: 500; }
        .links { text-align: center; padding: 20px; }
        .links a { color: rgba(255,255,255,0.88); text-decoration: none; margin: 0 15px; font-size: 0.95em; }
        .links a:hover { color: #fff; text-decoration: underline; }
        .meta { color: #6b7877; font-size: 0.9em; text-align: center; }
        a { color: #0b6e6c; }
        @media (max-width: 600px) { .card { padding: 26px 20px; } h1 { font-size: 2em; } .links a { display: inline-block; margin: 6px 10px; } }
    </style>
</head>
<body>
    <div class="hero small">
        <a href="index.html"><img src="icon.png" alt="Helsee app icon" class="app-icon"></a>
        <h1>Helsee</h1>
    </div>
    <div class="container">
{{CONTENT}}
    </div>
    <div class="links">
        <a href="index.html">Helsee</a>
        <a href="privacy.html">Privacy</a>
        <a href="terms.html">Terms</a>
        <a href="support.html">Support</a>
        <a href="mailto:kozlovskyaid@icloud.com">kozlovskyaid@icloud.com</a>
    </div>
</body>
</html>
